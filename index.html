<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR BLASTER</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(ellipse at top, #172554 0%, #070b1c 55%, #02040c 100%);
    color: #e5f3ff; font-family: system-ui, -apple-system, sans-serif;
  }
  .wrap { width: min(94vw, 560px); text-align: center; padding: 18px 0; }
  h1 { margin: 0 0 6px; letter-spacing: .18em; font-size: clamp(1.5rem, 5vw, 2.2rem); color: #7dd3fc; text-shadow: 0 0 18px #38bdf8; }
  .sub { color: #94a3b8; margin: 0 0 12px; font-size: .9rem; }
  .hud { display: flex; justify-content: space-between; gap: 8px; margin: 0 0 8px; font-weight: 700; font-size: .95rem; }
  .hud span { color: #f0abfc; }
  canvas { display: block; width: 100%; aspect-ratio: 3 / 4; border: 1px solid #334155; border-radius: 12px; background: #050816; box-shadow: 0 0 30px #0ea5e933; touch-action: none; }
  .controls { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  button { border: 1px solid #38bdf8; border-radius: 12px; color: #e0f2fe; background: #0c2340; padding: 12px 18px; font: inherit; font-weight: 700; cursor: pointer; }
  button:active { transform: scale(.97); background: #164e63; }
  #start { background: #075985; flex: 1; max-width: 210px; }
  .help { color: #94a3b8; font-size: .82rem; line-height: 1.6; margin: 10px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>STAR BLASTER</h1>
  <p class="sub">宇宙を駆けろ。敵を撃ち落とせ。</p>
  <div class="hud"><div>SCORE <span id="score">0</span></div><div>LIFE <span id="life">3</span></div><div>BEST <span id="best">0</span></div></div>
  <canvas id="game" width="480" height="640" aria-label="シューティングゲーム"></canvas>
  <div class="controls">
    <button id="left" aria-label="左へ移動">◀ 左</button>
    <button id="start">ゲームスタート</button>
    <button id="right" aria-label="右へ移動">右 ▶</button>
  </div>
  <p class="help">操作：← → / A D で移動、スペースで射撃<br>スマホは左右ボタンを押して移動。ショットは自動で発射！</p>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const lifeEl = document.getElementById('life');
  const bestEl = document.getElementById('best');
  const startBtn = document.getElementById('start');
  const W = canvas.width, H = canvas.height;
  let player, bullets, enemies, particles, stars, score, lives, frame, running, gameOver;
  let keys = {}, touchDir = 0, best = 0;
  try { best = Number(localStorage.getItem('starBlasterBest') || 0); } catch(e) {}
  bestEl.textContent = best;

  function reset() {
    player = { x: W/2, y: H-70, w: 30, h: 34, speed: 5.2, cooldown: 0, invincible: 0 };
    bullets = []; enemies = []; particles = [];
    stars = Array.from({length: 90}, () => ({x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+0.5, v: Math.random()*1.8+0.4}));
    score = 0; lives = 3; frame = 0; running = true; gameOver = false;
    scoreEl.textContent = score; lifeEl.textContent = lives;
    startBtn.textContent = 'プレイ中…';
  }
  function drawShip(x,y) {
    ctx.save(); ctx.translate(x,y);
    ctx.shadowBlur = 18; ctx.shadowColor = '#38bdf8';
    ctx.fillStyle = '#7dd3fc'; ctx.beginPath();
    ctx.moveTo(0,-21); ctx.lineTo(17,15); ctx.lineTo(5,10); ctx.lineTo(0,15); ctx.lineTo(-5,10); ctx.lineTo(-17,15); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 8; ctx.fillStyle = '#f0abfc'; ctx.beginPath(); ctx.ellipse(0,-3,4,9,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fb923c'; ctx.beginPath(); ctx.moveTo(-5,14); ctx.lineTo(0,25+Math.random()*6); ctx.lineTo(5,14); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function spawnEnemy() {
    const r = 14 + Math.random()*9;
    enemies.push({x: r+Math.random()*(W-2*r), y:-r, r, speed:1.25+Math.random()*1.2+score/900, drift:(Math.random()-.5)*1.5, hp:r>20?2:1, phase:Math.random()*6});
  }
  function burst(x,y,color,n=10) {
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, sp=Math.random()*3+1; particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:25+Math.random()*15,color});}
  }
  function textCenter(title, subtitle) {
    ctx.fillStyle = '#020617bb'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.shadowBlur=16; ctx.shadowColor='#38bdf8';
    ctx.fillStyle='#e0f2fe'; ctx.font='bold 34px system-ui'; ctx.fillText(title,W/2,H/2-18);
    ctx.shadowBlur=0; ctx.fillStyle='#cbd5e1'; ctx.font='16px system-ui'; ctx.fillText(subtitle,W/2,H/2+20);
  }
  function update() {
    frame++;
    stars.forEach(s=>{s.y+=s.v; if(s.y>H){s.y=0;s.x=Math.random()*W;}});
    if (!running) return;
    if (keys.ArrowLeft || keys.a || touchDir<0) player.x -= player.speed;
    if (keys.ArrowRight || keys.d || touchDir>0) player.x += player.speed;
    player.x = Math.max(22,Math.min(W-22,player.x));
    if(player.cooldown>0) player.cooldown--;
    if(player.cooldown<=0){bullets.push({x:player.x,y:player.y-20,v: -8.5});player.cooldown=11;}
    if(frame%Math.max(20,48-Math.floor(score/80))===0) spawnEnemy();
    bullets.forEach(b=>b.y+=b.v);
    bullets=bullets.filter(b=>b.y>-15);
    enemies.forEach(e=>{e.y+=e.speed;e.x+=e.drift+Math.sin(frame*.035+e.phase)*.55;if(e.x<e.r||e.x>W-e.r)e.drift*=-1;});
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      let hit=false;
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j];
        if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){bullets.splice(j,1);e.hp--;burst(b.x,b.y,'#7dd3fc',3);if(e.hp<=0){score+=10;scoreEl.textContent=score;burst(e.x,e.y,'#f0abfc',15);enemies.splice(i,1);hit=true;}break;}
      }
      if(hit)continue;
      if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+15 && player.invincible<=0){
        enemies.splice(i,1); lives--; lifeEl.textContent=lives; player.invincible=75; burst(player.x,player.y,'#fb7185',18);
        if(lives<=0){endGame();return;}
      } else if(e.y>H+e.r){enemies.splice(i,1);lives--;lifeEl.textContent=lives;if(lives<=0){endGame();return;}}
    }
    if(player.invincible>0)player.invincible--;
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.life--;});
    particles=particles.filter(p=>p.life>0);
  }
  function endGame(){
    running=false;gameOver=true;startBtn.textContent='もう一度プレイ';
    if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('starBlasterBest',best);}catch(e){}}
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#070b22');bg.addColorStop(1,'#10102b');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    stars.forEach(s=>{ctx.globalAlpha=.35+s.s*.25;ctx.fillStyle='#dbeafe';ctx.fillRect(s.x,s.y,s.s,s.s*2.2);});ctx.globalAlpha=1;
    bullets.forEach(b=>{ctx.shadowBlur=12;ctx.shadowColor='#67e8f9';ctx.fillStyle='#a5f3fc';ctx.fillRect(b.x-2,b.y-8,4,13);});ctx.shadowBlur=0;
    enemies.forEach(e=>{ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.sin(frame*.04+e.phase)*.15);ctx.shadowBlur=12;ctx.shadowColor='#fb7185';ctx.fillStyle=e.hp>1?'#c084fc':'#fb7185';ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5,rr=i%2===0?e.r:e.r*.68;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.fillStyle='#fff1f2';ctx.fillRect(-e.r*.45,-2, e.r*.9,4);ctx.restore();});ctx.shadowBlur=0;
    particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/35);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3);});ctx.globalAlpha=1;
    if(player && (!player.invincible || Math.floor(frame/5)%2===0))drawShip(player.x,player.y);
    if(!running && !gameOver)textCenter('STAR BLASTER','スタートボタンで出撃！');
    if(gameOver)textCenter('GAME OVER','スコア：'+score+'　もう一度挑戦しよう');
  }
  function loop(){update();draw();requestAnimationFrame(loop);}
  startBtn.addEventListener('click',()=>{reset();});
  window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();keys[e.key===' ' ? 'space':e.key]=true;if((e.key==='Enter')&&!running)reset();});
  window.addEventListener('keyup',e=>{keys[e.key===' ' ? 'space':e.key]=false;});
  function holdButton(id,dir){
    const el=document.getElementById(id);
    const on=e=>{e.preventDefault();touchDir=dir;};
    const off=e=>{e.preventDefault();if(touchDir===dir)touchDir=0;};
    el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
  }
  holdButton('left',-1);holdButton('right',1);
  canvas.addEventListener('pointermove',e=>{if(e.buttons){const r=canvas.getBoundingClientRect();if(player)player.x=(e.clientX-r.left)*W/r.width;}});
  reset();running=false;gameOver=false;startBtn.textContent='ゲームスタート';
  loop();
})();
</script>
</body>
</html>
